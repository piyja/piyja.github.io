projects:
  - title: "embeddedGraph"
    blurb: "Graph-based orchestration for embedded and edge systems — deterministic where it counts, agentic where it helps."
    detail: >-
      LangGraph popularised orchestration graphs for LLM agents, but it has no
      embedded story: no state machines, no safety primitives, no deterministic
      fallback. embeddedGraph is a C++20, zero-dependency framework that fills
      that gap. A statechart-based Hierarchical State Machine provides the
      deterministic behavioral contract, and a LangGraph-inspired execution
      graph runs inside each state. When the HSM enters SAFE_HALT all graph
      execution stops; when it enters DEGRADED only rule-based graphs run. That
      separation is what makes an embedded system certifiable — and it works
      just as well for non-AI applications like sensor pipelines, control loops
      and protocol handlers.
    url: "https://github.com/piyja/embeddedGraph"
    repo: "https://github.com/piyja/embeddedGraph"
    year: "2026"
    featured: true
    tags:
      - "C++20"
      - "HSM"
      - "Embedded"
      - "AI Agents"
      - "Zero-Dependency"

  - title: "piyja.github.io"
    blurb: "This site — a Jekyll knowledge graph that links every note, post and study document together."
    detail: >-
      A personal site built on the al-folio theme and extended well past its
      original scope. It merges three separate content collections — notes,
      blog posts and study documents — into a single force-directed knowledge
      graph at build time, then resolves wiki-links at runtime to wire in
      relationships nobody declared. Clicking any node pulls the rendered page
      and opens it in a side panel without leaving the graph.
    url: "/"
    repo: "https://github.com/piyja/piyja.github.io"
    year: "2026"
    featured: true
    tags:
      - "Jekyll"
      - "Liquid"
      - "D3.js"
      - "Graph Viz"

